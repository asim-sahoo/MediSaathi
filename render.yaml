# Render Blueprint - Deploy Node.js Backend
# https://render.com/docs/blueprint-spec
# Note: X-ray AI detection is hosted on HuggingFace Spaces

services:
  # Node.js Express Backend (Auth, Chat, API Gateway)
  - type: web
    name: medisaathi-api
    runtime: node
    plan: free
    region: oregon
    rootDir: Backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "8080"
      - key: MONGO_CONN
        sync: false  # Set this in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false  # Set this in Render dashboard
      - key: GEMINI_MODEL
        value: "gemini-1.5-flash"
      - key: PY_DETECT_URL
        value: "https://asimsahoo-medisaathi-ai.hf.space/detect"
    autoDeploy: true
